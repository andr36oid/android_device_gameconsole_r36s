odroidgoa-uboot-config

setenv bootrootfs "fw_devlink=permissive rootfstype=ext4 rootwait init=/init consoleblank=0 swiotlb=1 coherent_pool=1m"

setenv console "console=ttyS2,115200n8 androidboot.console=ttyS2 vt.global_cursor_default=0" 

setenv android "firmware_class.path=/vendor/firmware androidboot.hardware=rk30board androidboot.selinux=permissive"

setenv android2 "androidboot.revision=${hwrev} androidboot.serialno=${serial#} androidboot.boot_devices=ff3770000.dwmmc"

# Set load addresses
setenv kernel_addr_r "0x02000000"
setenv fdt_addr_r "0x01f00000"


load mmc 1:1 ${kernel_addr_r} Image-resizing


load mmc 1:1 ${fdt_addr_r} rk3326-r36s-android.dtb

setenv bootargs "${bootrootfs} ${android} ${android2} ${console}"

# English screens for the resizer: a small ramdisk
# (made by mkimg.sh) that the kernel unpacks over Image-resizing's own, so the
# resizer shows these pictures instead of its English 640x480 ones. The square
# set is picked by the size of logo.bmp, which comes from the screen folder
# (24-bit BMPs: 720x720 is 0x17bb36 bytes, the R46H's 1024x768 0x240036, the
# R50S's 480x854 0x12c3f6).
setenv ramdisk_addr_r "0x0a200000"
setenv initrd_high "0xffffffffffffffff"
setenv fdt_high "0xffffffffffffffff"
setenv screens resize-screens-640.uimg
if size mmc 1:1 logo.bmp; then
    if test "${filesize}" = "17bb36"; then
        setenv screens resize-screens-720.uimg
    fi
    if test "${filesize}" = "240036"; then
        setenv screens resize-screens-1024.uimg
    fi
    if test "${filesize}" = "12c3f6"; then
        setenv screens resize-screens-854.uimg
    fi
fi

# Boot. Without the screens file (or if booti refuses it), start as before.
if load mmc 1:1 ${ramdisk_addr_r} ${screens}; then
    booti ${kernel_addr_r} ${ramdisk_addr_r} ${fdt_addr_r}
fi
booti ${kernel_addr_r} - ${fdt_addr_r}
